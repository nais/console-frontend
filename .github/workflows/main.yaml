name: Build and push image and chart
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

env:
  NAME: console-frontend
  IMAGE_REPOSITORY: oci://europe-north1-docker.pkg.dev/nais-io/nais
jobs:
  build_push:
    env:
      ASSET_PREFIX: console/${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      version: ${{ steps.build-push-sign.outputs.version }}
    permissions:
      contents: "read"
      id-token: "write"
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # ratchet:jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync
      - name: Type check
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test -- --run
      - id: node_version
        run: echo "node_version=$(mise current node)" >> $GITHUB_OUTPUT
      - uses: nais/platform-build-push-sign@0f74f19fb291a0563f7d30e23fb83de3c4c7c851 # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          name: ${{ env.NAME }}
          google_service_account: gh-${{ env.NAME }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true
          build_args: |
            NODE_VERSION=${{ steps.node_version.outputs.node_version }}
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            ASSET_BASE_URL=https://cdn.nais.io/${{ env.ASSET_PREFIX }}
      - name: Extract client assets from published image
        env:
          IMAGE: ${{ steps.build-push-sign.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          container=$(docker create "$IMAGE")
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/app/client/." "$RUNNER_TEMP/console-assets"
      - name: Authenticate asset publisher
        id: asset-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # ratchet:google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: gh-console-frontend-assets@nais-io.iam.gserviceaccount.com
          export_environment_variables: false
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # ratchet:google-github-actions/setup-gcloud@v3
      - name: Upload client assets
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.asset-auth.outputs.credentials_file_path }}
        run: |
          gcloud storage rsync "$RUNNER_TEMP/console-assets" "gs://nais-io-cdn-assets/$ASSET_PREFIX" \
            --recursive \
            --exclude='.*\.(br|gz|map)$' \
            --cache-control='public,max-age=31536000,immutable' \
            --if-generation-match=0
      - name: Verify published asset through CDN
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/console-assets"
          entry=$(find "$asset_dir/_app/immutable/entry" -name 'start.*.js' -type f -print -quit)
          if [[ -z "$entry" ]]; then
            echo "::error::No client entry point found in the published image."
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            --header 'Origin: https://console.nav.cloud.nais.io' \
            --dump-header "$RUNNER_TEMP/cdn-entry.headers" \
            --output "$RUNNER_TEMP/cdn-entry.js" \
            "https://cdn.nais.io/$ASSET_PREFIX/${entry#"$asset_dir/"}"
          cmp "$entry" "$RUNNER_TEMP/cdn-entry.js"
          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*\*' "$RUNNER_TEMP/cdn-entry.headers"; then
            echo "::error::CDN response does not allow cross-origin module loading."
            exit 1
          fi
          if ! grep -Eiq '^content-type:[[:space:]]*(application|text)/(javascript|ecmascript)' "$RUNNER_TEMP/cdn-entry.headers"; then
            echo "::error::CDN entry point does not have a JavaScript content type."
            exit 1
          fi
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # ratchet:azure/setup-helm@v5
        name: "Setup Helm"
        with:
          version: "3.8.0"
      - name: Build Chart
        run: |-
          sed -i "s/^version: .*/version: ${{ steps.build-push-sign.outputs.version }}/g" charts/Chart.yaml
          cat charts/Chart.yaml
          helm package charts
      - name: Push Chart
        run: |-
          helm push ${{ env.NAME }}*.tgz ${{ env.IMAGE_REPOSITORY }}
  deploy:
    name: Deploy
    needs:
      - build_push
    # Only do this if on main
    if: endsWith(github.ref, '/main')
    runs-on: fasit-deploy
    permissions:
      id-token: write
    steps:
      - uses: nais/fasit-deploy@53e433b1bdd08fc622e03a78584c0832c9083bd3 # ratchet:nais/fasit-deploy@v4
        with:
          chart: ${{ env.IMAGE_REPOSITORY }}/${{ env.NAME }}
          version: ${{ needs.build_push.outputs.version }}
          targets: |
            [
              { "target": { "kind": "management", "tenant": "ci-nais" }, "wait": true },
              { "target": { "kind": "management" } }
            ]
