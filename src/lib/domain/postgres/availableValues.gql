query PostgresAvailableValues($team: Slug!, $env: String!) {
	team(slug: $team) {
		environment(name: $env) {
			environment {
				availableValues {
					postgresMajorVersions {
						values
						defaultValues
					}
					postgresExtensions {
						values
						defaultValues
					}
				}
			}
		}
	}
}
