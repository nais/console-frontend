query WorkloadHealthV0s($team: Slug!, $env: String!, $workload: String!) {
	team(slug: $team) {
		environment(name: $env) {
			workload(name: $workload) {
				... on Application {
					__typename
					vulnerabilityOverview {
						knownExploitedVulnerabilityCount
						coverage {
							status
							error
						}
					}
				}
				... on Job {
					__typename
					vulnerabilityOverview {
						knownExploitedVulnerabilityCount
						coverage {
							status
							error
						}
					}
				}
			}
		}
	}
}
