query UserInfo {
	me {
		__typename
		... on User {
			id
			name
			email
			isAdmin
			teams(first: 25) {
				edges {
					node {
						team {
							id
							slug
							purpose
						}
					}
				}
			}
		}
		... on ServiceAccount {
			__typename
		}
	}
	features {
		unleash {
			enabled
		}
		valkey {
			enabled
		}
		kafka {
			enabled
		}
		openSearch {
			enabled
		}
	}
}
