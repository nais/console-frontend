query UserInfo {
	me {
		__typename
		... on User {
			id
			name
			email
			isAdmin
			teams(first: 25, orderBy: { field: TEAM_SLUG, direction: ASC }) @paginate(mode: Infinite) {
				pageInfo {
					hasNextPage
					endCursor
					totalCount
				}
				nodes {
					team {
						id
						slug
						purpose
					}
				}
			}
		}
		... on ServiceAccount {
			__typename
		}
	}
	features {
		unleash {
			enabled
		}
		valkey {
			enabled
		}
		kafka {
			enabled
		}
		openSearch {
			enabled
		}
	}
}
