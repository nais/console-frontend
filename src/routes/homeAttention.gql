				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
				}
			}
			... on NoRunningInstancesIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
				}
			}
