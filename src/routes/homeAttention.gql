query HomeAttention {
	issues(first: 5, filter: { severity: CRITICAL, teamScope: { memberOfViewer: true } }) {
		pageInfo {
			totalCount
			hasNextPage
		}
		nodes {
			__typename
			... on ApplicationRestartLoopIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
				}
			}
			... on DeprecatedIngressIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				application {
					name
				}
			}
			... on DeprecatedRegistryIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
				}
			}
			... on ExternalIngressUrgentVulnerabilityIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
				}
			}
			... on FailedSynchronizationIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
				}
			}
			... on InvalidSpecIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				workload {
					... on Application {
						__typename
						name
					}
					... on Job {
						__typename
						name
					}
