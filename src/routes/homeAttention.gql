						name
					}
				}
			}
			... on SqlInstanceStateIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
					}
				}
				sqlInstance {
					name
				}
			}
			... on SqlInstanceVersionIssue {
				id
				message
				teamEnvironment {
					team {
						slug
					}
					environment {
						name
