query AdminServiceAccountDetail($id: ID!) @cache(policy: CacheAndNetwork) {
	serviceAccount(id: $id) {
		id
		name
		description
		createdAt
		updatedAt
		lastUsedAt
		workloadBindings {
			edges {
				node {
					teamSlug
					workloadName
					environment
				}
			}
		}
		...ServiceAccountRolesFragment
		...ServiceAccountAuthenticationFragment
		...ResourceActivityCardServiceAccountFragment
	}
	roles(first: 100, filter: { excludeGlobalRoles: false }) {
		edges {
			node {
				name
				description
			}
		}
	}
}
