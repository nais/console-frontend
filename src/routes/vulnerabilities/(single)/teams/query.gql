query TenantTeamPriorityGroups(
	$orderBy: TeamOrder!
	$teamScope: TeamScopeInput
	$highFirst: Int
	$highLast: Int
	$highAfter: Cursor
	$highBefore: Cursor
	$elevatedFirst: Int
	$elevatedLast: Int
	$elevatedAfter: Cursor
	$elevatedBefore: Cursor
	$monitorFirst: Int
	$monitorLast: Int
	$monitorAfter: Cursor
	$monitorBefore: Cursor
	$noneFirst: Int
	$noneLast: Int
	$noneAfter: Cursor
	$noneBefore: Cursor
	$coveredFirst: Int
	$coveredLast: Int
	$coveredAfter: Cursor
	$coveredBefore: Cursor
	$unprioritizedFirst: Int
	$unprioritizedLast: Int
	$unprioritizedAfter: Cursor
	$unprioritizedBefore: Cursor
) {
	high: teams(
		orderBy: $orderBy
		first: $highFirst
		last: $highLast
		after: $highAfter
		before: $highBefore
		filter: { teamScope: $teamScope, hasWorkloads: true, vulnerabilityPriorityGroup: HIGH }
	) {
		...TeamPriorityConnection @mask_disable
	}
	elevated: teams(
		orderBy: $orderBy
		first: $elevatedFirst
		last: $elevatedLast
		after: $elevatedAfter
		before: $elevatedBefore
		filter: { teamScope: $teamScope, hasWorkloads: true, vulnerabilityPriorityGroup: ELEVATED }
	) {
		...TeamPriorityConnection @mask_disable
	}
	monitor: teams(
		orderBy: $orderBy
		first: $monitorFirst
		last: $monitorLast
		after: $monitorAfter
		before: $monitorBefore
		filter: { teamScope: $teamScope, hasWorkloads: true, vulnerabilityPriorityGroup: MONITOR }
	) {
		...TeamPriorityConnection @mask_disable
	}
	none: teams(
		orderBy: $orderBy
		first: $noneFirst
		last: $noneLast
		after: $noneAfter
		before: $noneBefore
		filter: {
			teamScope: $teamScope
			hasWorkloads: true
			vulnerabilityPriorityGroup: NONE
			hasCompleteSbomCoverage: false
		}
	) {
		...TeamPriorityConnection @mask_disable
	}
	covered: teams(
		orderBy: $orderBy
		first: $coveredFirst
		last: $coveredLast
		after: $coveredAfter
		before: $coveredBefore
		filter: {
			teamScope: $teamScope
			hasWorkloads: true
			vulnerabilityPriorityGroup: NONE
			hasCompleteSbomCoverage: true
			hasVulnerabilityFindings: false
		}
	) {
		...TeamPriorityConnection @mask_disable
	}
	unprioritized: teams(
		orderBy: $orderBy
		first: $unprioritizedFirst
		last: $unprioritizedLast
		after: $unprioritizedAfter
		before: $unprioritizedBefore
		filter: {
			teamScope: $teamScope
			hasWorkloads: true
			vulnerabilityPriorityGroup: NONE
			hasCompleteSbomCoverage: true
			hasVulnerabilityFindings: true
		}
	) {
		...TeamPriorityConnection @mask_disable
	}
}

fragment TeamPriorityConnection on TeamConnection {
	pageInfo {
		endCursor
		hasNextPage
		hasPreviousPage
		pageEnd
		pageStart
		startCursor
		totalCount
	}
	edges {
		node {
			slug
			workloads {
				pageInfo {
					totalCount
				}
			}
			workloadsWithoutSbom: workloads(filter: { sbomStatus: NO_SBOM }) {
				pageInfo {
					totalCount
				}
			}
			vulnerabilitySummary {
				countsBySeverity {
					critical
					high
					medium
					low
					unassigned
				}
				countsByPriority {
					knownExploited
					highRisk
					elevatedRisk
					monitor
				}
				riskScore
				riskScoreTrend
				coverage
				sbomCount
			}
		}
	}
}
