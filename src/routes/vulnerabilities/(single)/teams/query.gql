query TenantVulnerabilityTeams($first: Int, $last: Int, $after: Cursor, $before: Cursor) {
	teams(
		first: $first
		last: $last
		after: $after
		before: $before
		filter: { hasWorkloads: true }
		orderBy: { field: SLUG, direction: ASC }
	) @paginate(mode: SinglePage) {
		pageInfo {
			endCursor
			hasNextPage
			hasPreviousPage
			pageEnd
			pageStart
			startCursor
			totalCount
		}
		edges {
			node {
				id
				slug
				workloads {
					pageInfo {
						totalCount
					}
				}
				workloadsWithoutSbom: workloads(filter: { sbomStatus: NO_SBOM }) {
					pageInfo {
						totalCount
					}
				}
				vulnerabilitySummary {
					countsByPriority {
						knownExploited
					}
					critical
					high
					medium
					low
					unassigned
					coverage
					sbomCount
				}
			}
		}
	}
}
