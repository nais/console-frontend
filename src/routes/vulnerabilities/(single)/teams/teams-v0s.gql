query TenantV0sTeams($first: Int, $after: Cursor) {
	teams(
		first: $first
		after: $after
		filter: { hasWorkloads: true }
		orderBy: { field: SLUG, direction: ASC }
	) {
		pageInfo {
			endCursor
			hasNextPage
			hasPreviousPage
			pageEnd
			pageStart
			startCursor
			totalCount
		}
		edges {
			node {
				id
				slug
				vulnerabilityFindings(first: 1) {
					summary {
						...V0sSelectionSummary @mask_disable
					}
				}
			}
		}
	}
}
