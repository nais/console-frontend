query CveList($first: Int, $last: Int, $after: Cursor, $before: Cursor, $orderBy: CVEOrder) {
	cves(first: $first, last: $last, after: $after, before: $before, orderBy: $orderBy) {
		pageInfo {
			endCursor
			hasNextPage
			hasPreviousPage
			pageEnd
			pageStart
			startCursor
			totalCount
		}
		edges {
			node {
				id
				identifier
				severity
				title
				riskAssessment {
					epssScore
					hasKevEntry
				}
				workloads {
					pageInfo {
						totalCount
					}
				}
			}
		}
	}
}
