query CVEWorkloads(
	$identifier: String!
	$first: Int
	$last: Int
	$after: Cursor
	$before: Cursor
	$orderBy: CVEWorkloadOrder
	$filter: CVEWorkloadsFilter
) {
	cve(identifier: $identifier) {
		id
		workloads(
			first: $first
			last: $last
			after: $after
			before: $before
			orderBy: $orderBy
			filter: $filter
		) {
			impact {
				...CveImpactFragment
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
				totalCount
				pageStart
				pageEnd
			}
			nodes {
				id
				workload {
					... on Application {
						__typename
						name
						team {
							slug
						}
						teamEnvironment {
							environment {
								name
							}
						}
						image {
							name
							tag
							digest
						}
					}
					... on Job {
						__typename
						name
						team {
							slug
						}
						teamEnvironment {
							environment {
								name
							}
						}
						image {
							name
							tag
							digest
						}
					}
				}
				vulnerability {
					identifier
					severity
					package
					remediation {
						fixVersion
					}
					riskAssessment {
						epssScore
						epssPercentile
						hasKevEntry
						knownRansomwareUse
					}
					suppression {
						state
					}
				}
			}
		}
	}
}
