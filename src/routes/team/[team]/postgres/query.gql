query TeamPostgres(
	$team: Slug!
	$filter: TeamPostgresFilter
	$backupFilter: PostgresBackupFilter
	$first: Int
	$last: Int
	$before: Cursor
	$after: Cursor
) {
	team(slug: $team) {
		environments {
			gcpProjectID
			environment {
				name
			}
		}
		postgreses(first: $first, last: $last, filter: $filter, before: $before, after: $after)
			@paginate(mode: SinglePage) {
			pageInfo {
				hasNextPage
				hasPreviousPage
				pageStart
				pageEnd
				totalCount
				startCursor
				endCursor
			}
			facets {
				labels {
					key
					value
					count
				}
			}
			edges {
				node {
					id
					name
					state
					teamEnvironment {
						environment {
							name
						}
					}
					majorVersion
				}
			}
		}
		postgresBackups(first: 25, filter: $backupFilter) {
			pageInfo {
				totalCount
			}
			nodes {
				id
				name
				sourcePostgres
				phase
				retentionDays
				majorVersion
				diskSize
				extensions
				sizeBytes
				createdAt
				completedAt
				expiresAt
				errorMessage
				teamEnvironment {
					environment {
						name
					}
				}
			}
		}
	}
}
