query TeamRoles($team: Slug!) {
	team(slug: $team) {
		postgreses(first: 1) {
			pageInfo {
				totalCount
			}
		}
		members {
			pageInfo {
				totalCount
			}
		}
		viewerIsOwner
		viewerIsMember
		deletionInProgress
		lastSuccessfulSync
		externalResources {
			gitHubTeam {
				slug
			}
		}
		purpose
	}
}
