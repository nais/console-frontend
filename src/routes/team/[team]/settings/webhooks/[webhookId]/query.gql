query TeamWebhookDeliveries($id: ID!, $after: Cursor, $before: Cursor, $first: Int, $last: Int) {
	node(id: $id) {
		__typename
		... on WebhookSubscription {
			id
			deliveries(after: $after, before: $before, first: $first, last: $last)
				@paginate(mode: SinglePage) {
				pageInfo {
					totalCount
					hasNextPage
					hasPreviousPage
					pageStart
					pageEnd
					startCursor
					endCursor
				}
				nodes {
					...WebhookDeliveryFields @mask_disable
				}
			}
		}
	}
}
