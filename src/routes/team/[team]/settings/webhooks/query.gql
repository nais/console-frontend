query TeamWebhooks($team: Slug!, $after: Cursor, $before: Cursor, $first: Int, $last: Int) {
	team(slug: $team) {
		webhooks(after: $after, before: $before, first: $first, last: $last)
			@paginate(mode: SinglePage) {
			pageInfo {
				totalCount
				hasNextPage
				hasPreviousPage
				pageStart
				pageEnd
				startCursor
				endCursor
			}
			nodes {
				id
				name
				url
				enabled
				consecutiveFailures
				disabledAt
				createdAt
				deliveries(first: 1) {
					nodes {
						id
						createdAt
						success
						isTest
					}
				}
			}
		}
	}
}
