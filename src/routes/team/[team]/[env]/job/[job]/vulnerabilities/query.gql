query JobImageDetails($team: Slug!, $env: String!, $job: String!) @cache(policy: NetworkOnly) {
	team(slug: $team) {
		slug
		environment(name: $env) {
			environment {
				name
			}
			workload(name: $job) {
				... on Job {
					__typename
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
					image {
						id
						name
						tag
						digest
						sbom {
							status
							processingStartedAt
						}
						activityLog {
							pageInfo {
								hasNextPage
								endCursor
								hasPreviousPage
								startCursor
								totalCount
								pageStart
								pageEnd
							}
							edges {
								node {
									id
									__typename
									...ActivityLogEntryFragment
								}
							}
						}
						vulnerabilitySummary {
							countsByPriority {
								knownExploited
								highRisk
								elevatedRisk
								monitor
							}
							critical
							high
							medium
							low
							unassigned
							riskScore
							lastUpdated
							staleImageTag
						}
						workloadReferences {
							edges {
								node {
									workload {
										id
										__typename
										team {
											slug
										}
										teamEnvironment {
											environment {
												name
											}
										}
										name
									}
								}
							}
						}
						handleFirst: vulnerabilities(
							first: 50
							filter: { hasKevEntry: true }
							orderBy: { field: SEVERITY, direction: DESC }
						) {
							pageInfo {
								totalCount
							}
							edges {
								node {
									id
									identifier
									package
									priority
									fixVersion
									latestVersion
									epssScore
									epssPercentile
									hasKevEntry
									knownRansomwareUse
								}
							}
						}
						knownExploitedHigh: vulnerabilities(filter: { priorities: [HIGH], hasKevEntry: true }) {
							pageInfo {
								totalCount
							}
						}
						knownExploitedElevated: vulnerabilities(
							filter: { priorities: [ELEVATED], hasKevEntry: true }
						) {
							pageInfo {
								totalCount
							}
						}
						knownExploitedMonitor: vulnerabilities(
							filter: { priorities: [MONITOR], hasKevEntry: true }
						) {
							pageInfo {
								totalCount
							}
						}
					}
				}
			}
		}
	}
}
