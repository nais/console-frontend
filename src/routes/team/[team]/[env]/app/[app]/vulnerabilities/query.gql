query ApplicationImageDetails($team: Slug!, $env: String!, $app: String!)
@cache(policy: NetworkOnly) {
	team(slug: $team) {
		slug
		environment(name: $env) {
			environment {
				name
			}
			workload(name: $app) {
				... on Application {
					__typename
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
					ingresses {
						type
					}
					urgentVulnerabilityIssues: issues(
						first: 1
						filter: { issueType: EXTERNAL_INGRESS_URGENT_VULNERABILITY }
					) {
						edges {
							node {
								... on ExternalIngressUrgentVulnerabilityIssue {
									__typename
									priorityUrgent
								}
							}
						}
					}
					image {
						id
						name
						tag
						digest
						sbom {
							status
							processingStartedAt
						}
						activityLog @paginate(mode: SinglePage) {
							pageInfo {
								hasNextPage
								endCursor
								hasPreviousPage
								startCursor
								totalCount
								pageStart
								pageEnd
							}
							edges {
								node {
									id
									__typename
									...ActivityLogEntryFragment
								}
							}
						}
						vulnerabilitySummary {
							countsByPriority {
								knownExploited
								highRisk
								elevatedRisk
								monitor
							}
							critical
							high
							medium
							low
							unassigned
							riskScore
							lastUpdated
							staleImageTag
						}
						workloadReferences(first: 20) {
							pageInfo {
								hasNextPage
								hasPreviousPage
								startCursor
								endCursor
								totalCount
								pageStart
								pageEnd
							}
							edges {
								node {
									workload {
										... on Application {
											__typename
											id
											name
											team {
												slug
											}
											teamEnvironment {
												environment {
													name
												}
											}
										}
										... on Job {
											__typename
											id
											name
											team {
												slug
											}
											teamEnvironment {
												environment {
													name
												}
											}
										}
									}
								}
							}
						}
						handleFirst: vulnerabilities(
							first: 50
							filter: { hasKevEntry: true }
							orderBy: { field: SEVERITY, direction: DESC }
						) {
							pageInfo {
								totalCount
							}
							edges {
								node {
									id
									identifier
									package
									severitySince
									riskAssessment {
										priority
										epssScore
										epssPercentile
										hasKevEntry
										knownRansomwareUse
									}
									remediation {
										fixVersion
										latestVersion
									}
								}
							}
						}
						knownExploitedHigh: vulnerabilities(filter: { priorities: [HIGH], hasKevEntry: true }) {
							pageInfo {
								totalCount
							}
						}
						knownExploitedElevated: vulnerabilities(
							filter: { priorities: [ELEVATED], hasKevEntry: true }
						) {
							pageInfo {
								totalCount
							}
						}
						knownExploitedMonitor: vulnerabilities(
							filter: { priorities: [MONITOR], hasKevEntry: true }
						) {
							pageInfo {
								totalCount
							}
						}
					}
				}
				... on Job {
					__typename
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
			}
		}
	}
}
