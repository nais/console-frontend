query ApplicationImageDetails($team: Slug!, $env: String!, $app: String!)
@cache(policy: NetworkOnly) {
	team(slug: $team) {
		slug
		environment(name: $env) {
			environment {
				name
			}
			workload(name: $app) {
				... on Application {
					__typename
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
					ingresses {
						type
					}
					image {
						id
						name
						tag
						digest
						sbom {
							status
							processingStartedAt
						}
						activityLog @paginate(mode: SinglePage) {
							pageInfo {
								hasNextPage
								endCursor
								hasPreviousPage
								startCursor
								totalCount
								pageStart
								pageEnd
							}
							edges {
								node {
									id
									__typename
									...ActivityLogEntryFragment
								}
							}
						}
						vulnerabilitySummary {
							countsByPriority {
								knownExploited
							}
							critical
							high
							medium
							low
							unassigned
							lastUpdated
							staleImageTag
						}
						workloadReferences(first: 20) {
							pageInfo {
								hasNextPage
								hasPreviousPage
								startCursor
								endCursor
								totalCount
								pageStart
								pageEnd
							}
							edges {
								node {
									workload {
										... on Application {
											__typename
											id
											name
											team {
												slug
											}
											teamEnvironment {
												environment {
													name
												}
											}
										}
										... on Job {
											__typename
											id
											name
											team {
												slug
											}
											teamEnvironment {
												environment {
													name
												}
											}
										}
									}
								}
							}
						}
						packageTypeFacets: vulnerabilities(first: 1) {
							facets {
								packageTypes {
									value
									count
								}
							}
						}
						handleFirst: vulnerabilities(
							first: 50
							filter: { hasKevEntry: true }
							orderBy: { field: SEVERITY, direction: DESC }
						) {
							pageInfo {
								totalCount
							}
							edges {
								node {
									id
									identifier
									package
									riskAssessment {
										epssScore
										hasKevEntry
									}
								}
							}
						}
					}
				}
				... on Job {
					__typename
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
			}
		}
	}
}
