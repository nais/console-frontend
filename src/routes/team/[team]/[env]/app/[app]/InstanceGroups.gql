query AppInstanceGroups($app: String!, $team: Slug!, $env: String!) {
	team(slug: $team) {
		environment(name: $env) {
			application(name: $app) {
				resources {
					scaling {
						...ApplicationScalingDiagnostics @mask_disable
					}
				}
				rolloutIssues: issues(first: 1, filter: { issueType: APPLICATION_ROLLOUT_STUCK }) {
					nodes {
						__typename
						... on ApplicationRolloutStuckIssue {
							id
							reason
							message
						}
					}
				}
				instanceGroups {
					id
					name
					image {
						name
						tag
						digest
					}
					created
					desiredInstances
					instances {
						id
						status {
							state
							ready
							message
						}
					}
				}
			}
		}
	}
}
