query PostgresOverview($team: Slug!, $env: String!, $name: String!) {
	team(slug: $team) {
		environment(name: $env) {
			postgres(name: $name) {
				...PersistenceActivityCardPostgresFragment
				id
				name
				teamEnvironment {
					environment {
						name
					}
				}
				majorVersion
				extensions
				highAvailability
				state
				resources {
					cpu
					memory
					diskSize
				}
				labels {
					key
					value
				}
				configuration {
					parameters {
						name
						value
					}
				}
				workloads(first: 25) {
					pageInfo {
						totalCount
					}
					nodes {
						postgres {
							id
							name
						}
						workload {
							... on Application {
								__typename
								id
								name
								team {
									slug
								}
								teamEnvironment {
									environment {
										name
									}
								}
							}
							... on Job {
								__typename
								id
								name
								team {
									slug
								}
								teamEnvironment {
									environment {
										name
									}
								}
							}
						}
					}
				}
			}
		}
	}
}
