query PostgresBranches($team: Slug!, $env: String!, $name: String!, $first: Int!) {
	me {
		... on User {
			isAdmin
		}
	}
	team(slug: $team) {
		environment(name: $env) {
			postgres(name: $name) {
				id
				name
				activeBranch {
					id
					name
					state
					createdAt
					...PostgresBranchUsage @mask_disable
				}
				desiredActiveBranch
				branches(first: $first) @paginate(mode: Infinite) {
					pageInfo {
						hasNextPage
					}
					nodes {
						id
						name
						state
						createdAt
						...PostgresBranchUsage @mask_disable
					}
				}
			}
		}
	}
}

fragment PostgresBranchUsage on PostgresBranch {
	workloads(first: 5) {
		pageInfo {
			totalCount
		}
		nodes {
			... on Application {
				__typename
				id
				name
				team {
					slug
				}
				teamEnvironment {
					environment {
						name
					}
				}
			}
			... on Job {
				__typename
				id
				name
				team {
					slug
				}
				teamEnvironment {
					environment {
						name
					}
				}
			}
		}
	}
}
