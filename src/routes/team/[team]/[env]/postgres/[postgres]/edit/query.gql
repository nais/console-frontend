query EditPostgres($team: Slug!, $env: String!, $name: String!) {
	team(slug: $team) {
		environment(name: $env) {
			environment {
				availableValues {
					postgresExtensions {
						values
					}
				}
			}
			postgres(name: $name) {
				id
				name
				highAvailability
				extensions
				resources {
					cpu
					memory
					diskSize
				}
			}
		}
	}
}
