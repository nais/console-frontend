query Alerts(
	$team: Slug!
	$filter: TeamAlertsFilter
	$orderBy: AlertOrder
	$first: Int
	$last: Int
	$before: Cursor
	$after: Cursor
) {
	team(slug: $team) {
		slug
		alerts(
			first: $first
			last: $last
			filter: $filter
			orderBy: $orderBy
			before: $before
			after: $after
		) @paginate(mode: SinglePage) {
			pageInfo {
				startCursor
				endCursor
				hasNextPage
				hasPreviousPage
				pageStart
				pageEnd
				totalCount
			}
			edges {
				node {
					id
					name
					state
					query
					duration
					... on PrometheusAlert {
						alarms {
							action
							consequence
							since
							summary
							state
							value
						}
						ruleGroup
					}
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
			}
			facets {
				environments {
					value
					count
				}
				states {
					state
					count
				}
			}
		}
	}
}
