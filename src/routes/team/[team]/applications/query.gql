query Applications(
	$team: Slug!
	$orderBy: ApplicationOrder
	$filter: TeamApplicationsFilter
	$first: Int
	$last: Int
	$before: Cursor
	$after: Cursor
) {
	team(slug: $team) {
		applications(
			first: $first
			last: $last
			orderBy: $orderBy
			filter: $filter
			before: $before
			after: $after
		) @paginate(mode: SinglePage) {
			pageInfo {
				totalCount
				hasNextPage
				hasPreviousPage
				pageEnd
				pageStart
				startCursor
				endCursor
			}
			facets {
				environments {
					value
					count
				}
				states {
					state
					count
				}
				labels {
					key
					value
					count
				}
			}
			edges {
				node {
					__typename
					id
					name
					teamEnvironment {
						environment {
							name
						}
					}
					team {
						slug
					}
					state
					issues {
						pageInfo {
							totalCount
						}
						edges {
							node {
								severity
							}
						}
					}
					activityLog(
						first: 1
						filter: {
							activityTypes: [
								DEPLOYMENT
								APPLICATION_UPDATED
								JOB_UPDATED
								GENERIC_KUBERNETES_RESOURCE_CREATED
							]
						}
					) {
						nodes {
							createdAt
						}
					}
					instances {
						pageInfo {
							totalCount
						}
						edges {
							node {
								status {
									message
									state
								}
							}
						}
					}
				}
			}
		}
	}
}
