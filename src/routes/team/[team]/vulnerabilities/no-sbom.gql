query TeamNoSbomWorkloads(
	$team: Slug!
	$first: Int
	$last: Int
	$after: Cursor
	$before: Cursor
	$orderBy: WorkloadOrder
) {
	team(slug: $team) {
		workloads(
			first: $first
			last: $last
			after: $after
			before: $before
			filter: { sbomStatus: NO_SBOM }
			orderBy: $orderBy
		) @paginate(mode: SinglePage) {
			nodes {
				... on Application {
					__typename
					id
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
				... on Job {
					__typename
					id
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				pageStart
				pageEnd
				startCursor
				endCursor
				totalCount
			}
		}
	}
}
