query TeamNoSbomWorkloads($team: Slug!, $first: Int!, $after: Cursor, $orderBy: WorkloadOrder) {
	team(slug: $team) {
		workloads(first: $first, after: $after, filter: { sbomStatus: NO_SBOM }, orderBy: $orderBy)
			@paginate(mode: Infinite) {
			nodes {
				... on Application {
					__typename
					id
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
				... on Job {
					__typename
					id
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
				}
			}
			pageInfo {
				hasNextPage
				endCursor
				totalCount
			}
		}
	}
}
