query TeamPriorityWorkloadsHigh(
	$team: Slug!
	$orderBy: VulnerabilitySummaryOrder
	$environmentName: String
	$labels: [LabelFilter!]
) {
	team(slug: $team) {
		vulnerabilitySummaries(
			first: 20
			filter: { priorities: [HIGH], environmentName: $environmentName, labels: $labels }
			orderBy: $orderBy
		) @paginate(mode: SinglePage) {
			pageInfo {
				hasNextPage
				hasPreviousPage
				pageStart
				pageEnd
				startCursor
				endCursor
				totalCount
			}
			edges {
				node {
					id
					workload {
						... on Application {
							__typename
							id
							name
							labels {
								key
								value
							}
							team {
								slug
							}
							teamEnvironment {
								environment {
									name
								}
							}
							ingresses {
								type
							}
							image {
								sbom {
									status
									processingStartedAt
								}
							}
						}
						... on Job {
							__typename
							id
							name
							labels {
								key
								value
							}
							team {
								slug
							}
							teamEnvironment {
								environment {
									name
								}
							}
							image {
								sbom {
									status
									processingStartedAt
								}
							}
						}
					}
					summary {
						countsByPriority {
							knownExploited
							highRisk
							elevatedRisk
							monitor
						}
						riskScore
						lastUpdated
						staleImageTag
					}
				}
			}
		}
	}
}
