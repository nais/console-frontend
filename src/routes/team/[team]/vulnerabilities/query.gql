query TeamVulnerabilities(
	$team: Slug!
	$environmentName: String
	$labels: [LabelFilter!]
	$unfiltered: Boolean! = true
) {
	team(slug: $team) {
		applications(first: 1) {
			facets {
				labels {
					key
					value
					count
				}
			}
		}
		jobs(first: 1) {
			facets {
				labels {
					key
					value
					count
				}
			}
		}
		urgentVulnerabilityIssues: issues(filter: { issueType: EXTERNAL_INGRESS_URGENT_VULNERABILITY })
			@include(if: $unfiltered) {
			pageInfo {
				totalCount
			}
		}
		exploitedWorkloads: vulnerabilitySummaries(
			first: 1
			filter: { hasKevEntry: true, environmentName: $environmentName, labels: $labels }
		) {
			pageInfo {
				totalCount
			}
		}
		environments {
			id
			environment {
				name
			}
		}
		workloads {
			pageInfo {
				totalCount
			}
		}
		workloadsWithoutSbom: workloads(filter: { sbomStatus: NO_SBOM }) {
			pageInfo {
				totalCount
			}
		}
		teamVulnerabilitySummary: vulnerabilitySummary {
			sbomCount
		}
		vulnerabilitySummary(filter: { environmentName: $environmentName, labels: $labels }) {
			sbomCount
			coverage
			highWorkloadCount
			elevatedWorkloadCount
			monitorWorkloadCount
			countsByPriority {
				knownExploited
				highRisk
				elevatedRisk
				monitor
			}
			critical
			high
			medium
			low
			unassigned
			riskScore
			riskScoreTrend @include(if: $unfiltered)
			lastUpdated
		}
	}
}
