query TeamVulnerabilities($team: Slug!, $environmentName: String, $labels: [LabelFilter!]) {
	team(slug: $team) {
		applications(first: 1) {
			facets {
				labels {
					key
					value
					count
				}
			}
		}
		jobs(first: 1) {
			facets {
				labels {
					key
					value
					count
				}
			}
		}
		exploitedWorkloads: vulnerabilitySummaries(
			first: 1
			filter: { hasKevEntry: true, environmentName: $environmentName, labels: $labels }
		) {
			pageInfo {
				totalCount
			}
		}
		environments {
			id
			environment {
				name
			}
		}
		workloads {
			pageInfo {
				totalCount
			}
		}
		workloadsWithoutSbom: workloads(filter: { sbomStatus: NO_SBOM }) {
			pageInfo {
				totalCount
			}
		}
		teamVulnerabilitySummary: vulnerabilitySummary {
			sbomCount
		}
		vulnerabilitySummary(filter: { environmentName: $environmentName, labels: $labels }) {
			sbomCount
			coverage
			countsByPriority {
				knownExploited
			}
			critical
			high
			medium
			low
			unassigned
		}
	}
}
