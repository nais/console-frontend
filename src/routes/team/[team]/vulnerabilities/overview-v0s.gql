query TeamV0sOverview(
	$team: Slug!
	$environments: [String!]
	$labels: [LabelFilter!]
	$first: Int
	$after: Cursor
	$orderBy: WorkloadOrder!
) {
	team(slug: $team) {
		applications(first: 1, filter: { environments: $environments, labels: $labels }) {
			facets {
				labels {
					key
					value
					count
				}
			}
		}
		jobs(first: 1, filter: { name: "", environments: $environments, labels: $labels }) {
			facets {
				labels {
					key
					value
					count
				}
			}
		}
		environments {
			id
			environment {
				name
			}
		}
		vulnerabilityFindings(first: 1, filter: { environments: $environments, labels: $labels }) {
			summary {
				...V0sSelectionSummary @mask_disable
			}
		}
		workloads(
			first: $first
			after: $after
			filter: { environments: $environments, labels: $labels }
			orderBy: $orderBy
		) {
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
				pageStart
				pageEnd
				totalCount
			}
			nodes {
				... on Application {
					__typename
					id
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
					vulnerabilityOverview {
						...V0sWorkloadOverview @mask_disable
					}
				}
				... on Job {
					__typename
					id
					name
					team {
						slug
					}
					teamEnvironment {
						environment {
							name
						}
					}
					vulnerabilityOverview {
						...V0sWorkloadOverview @mask_disable
					}
				}
			}
		}
	}
}
