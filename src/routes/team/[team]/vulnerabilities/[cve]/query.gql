query TeamCVEPage($identifier: String!, $team: Slug!) {
	cve(identifier: $identifier) {
		id
		identifier
		title
		description
		severity
		detailsLink
		kevEntry {
			...KevGuidanceFragment
		}
		riskAssessment {
			priority
			cvssScore
			hasKevEntry
			knownRansomwareUse
			epssScore
			epssPercentile
		}
	}
	team(slug: $team) {
		viewerIsMember
	}
}
