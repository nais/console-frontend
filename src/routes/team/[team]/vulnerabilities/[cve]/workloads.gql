query TeamCVEWorkloads(
	$identifier: String!
	$first: Int!
	$filter: CVEWorkloadsFilter
	$orderBy: CVEWorkloadOrder
) {
	cve(identifier: $identifier) {
		id
		workloads(first: $first, filter: $filter, orderBy: $orderBy) @paginate(mode: Infinite) {
			impact {
				...CveImpactFragment
			}
			pageInfo {
				totalCount
				hasNextPage
				endCursor
			}
			edges {
				node {
					id
					workload {
						... on Application {
							__typename
							id
							name
							team {
								slug
							}
							teamEnvironment {
								environment {
									name
								}
							}
							image {
								name
								tag
								digest
							}
						}
						... on Job {
							__typename
							id
							name
							team {
								slug
							}
							teamEnvironment {
								environment {
									name
								}
							}
							image {
								name
								tag
								digest
							}
						}
					}
					vulnerability {
						id
						identifier
						severity
						package
						remediation {
							fixVersion
							latestVersion
						}
						suppression {
							state
						}
					}
				}
			}
		}
	}
}
